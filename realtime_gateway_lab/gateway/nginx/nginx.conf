# A second gateway, so you can see the same pattern twice.
#
# Traefik calls it ForwardAuth; nginx calls it auth_request. Same shape: a
# subrequest to an authorization service, and the identity it returns is copied
# onto the upstream request. Knowing that these are the same idea, with the same
# failure modes, is worth more than knowing either syntax.
#
# This file also has two locations that differ ONLY in buffering, so scenario 05
# can measure what a reverse proxy does to a stream instead of asserting it.

events { worker_connections 1024; }

http {
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    upstream api { server api:8000; }

    # Strip the demo prefix once, in one place, and reuse it for BOTH the
    # authorization subrequest and the upstream call. If these two disagreed —
    # authorizing /streamed/feed while proxying /feed — you would have a policy
    # that is evaluated against a path nobody ever serves. That is a real and
    # popular way to end up with an unprotected route.
    map $uri $api_path {
        "~^/buffered(?<rest>/.*)$"  $rest;
        "~^/streamed(?<rest>/.*)$"  $rest;
        default                     $uri;
    }

    server {
        listen 8080;

        # The authorization subrequest. nginx discards its body and uses only
        # the status: 2xx allows, 401/403 are returned to the client.
        location = /_authz {
            internal;                       # not reachable from outside
            proxy_pass http://authz:8000/auth;
            proxy_pass_request_body off;    # the auth service never sees the body
            proxy_set_header Content-Length "";
            proxy_set_header X-Forwarded-Method $request_method;
            # $fwd_uri, not $api_path: inside an auth subrequest $uri is
            # "/_authz", so a map keyed on $uri would hand the policy engine
            # the URI of the auth endpoint instead of the URI being authorized
            # — and a policy that matches nothing means default deny on every
            # route. The parent location snapshots it with `set` first.
            proxy_set_header X-Forwarded-Uri    $fwd_uri;
        }

        # Unauthenticated, and therefore says nothing but "ok".
        location = /healthz {
            proxy_pass http://api/healthz;
        }

        # ---- The default, and the bug -----------------------------------
        # proxy_buffering is ON by default in nginx, and for a normal response
        # that is a feature: nginx reads the upstream as fast as it can, frees
        # the upstream connection, and dribbles the bytes out to a slow client.
        #
        # For a stream it is a disaster. nginx holds events in its buffer until
        # the buffer fills or the upstream closes, so a feed that emits one
        # event a second delivers nothing for a minute and then everything at
        # once. The application is behaving perfectly and the user sees a hung
        # page. Scenario 05 measures the delay.
        location /buffered/ {
            set $fwd_uri $api_path;
            auth_request /_authz;
            auth_request_set $auth_subject   $upstream_http_x_auth_subject;
            auth_request_set $auth_role      $upstream_http_x_auth_role;
            auth_request_set $auth_org       $upstream_http_x_auth_org;
            auth_request_set $auth_signature $upstream_http_x_auth_signature;

            proxy_set_header X-Auth-Subject   $auth_subject;
            proxy_set_header X-Auth-Role      $auth_role;
            proxy_set_header X-Auth-Org       $auth_org;
            proxy_set_header X-Auth-Signature $auth_signature;
            # An empty value deletes the header. Strip everything in the trusted
            # namespace that the auth service does not itself set, or a client
            # can smuggle one through.
            proxy_set_header X-User-Id        "";
            proxy_set_header X-Auth-Source    "";

            proxy_pass http://api$api_path$is_args$args;
            proxy_http_version 1.1;

            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 4 16k;

            # `gzip on` for text/* is in every hardening guide, and
            # text/event-stream is text/*. The compressor works in blocks: it
            # will not emit anything until it has enough input, so small
            # frames sit in the deflate window instead of reaching the client.
            gzip on;
            gzip_types text/event-stream text/plain application/json;
            gzip_min_length 1;
            # Short on purpose: an idle stream gets killed, which is the second
            # half of scenario 05.
            proxy_read_timeout 5s;
        }

        # ---- The same upstream, configured for streaming -----------------
        location /streamed/ {
            set $fwd_uri $api_path;
            auth_request /_authz;
            auth_request_set $auth_subject   $upstream_http_x_auth_subject;
            auth_request_set $auth_role      $upstream_http_x_auth_role;
            auth_request_set $auth_org       $upstream_http_x_auth_org;
            auth_request_set $auth_signature $upstream_http_x_auth_signature;

            proxy_set_header X-Auth-Subject   $auth_subject;
            proxy_set_header X-Auth-Role      $auth_role;
            proxy_set_header X-Auth-Org       $auth_org;
            proxy_set_header X-Auth-Signature $auth_signature;
            proxy_set_header X-User-Id        "";
            proxy_set_header X-Auth-Source    "";

            proxy_pass http://api$api_path$is_args$args;
            proxy_http_version 1.1;

            proxy_buffering off;             # send each chunk as it arrives
            proxy_cache off;                 # never cache a stream
            proxy_set_header Connection "";  # keep the upstream connection alive
            chunked_transfer_encoding on;

            # Comfortably larger than the application's keep-alive interval.
            # Note that this is a RELATIONSHIP between two settings in two
            # different repositories — the proxy's timeout and the app's
            # block_ms — which is exactly why it breaks so often and so late.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
