[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "learn-vector-db-pgvector"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.4,<1",
]

[tool.setuptools]
packages = ["learn_vector_db_pgvector"]

